<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story — Versículo · A Promessa de Abraão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="assets/marca.css">
<style>
  .versiculo { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 250px 96px 420px; }
  .versiculo > * { position: relative; z-index: 2; }
  .versiculo .ceu { position: absolute; z-index: 0; }

  .v-chamada { color: var(--ouro); }
  .v-bloco { position: relative; margin-top: 56px; width: 100%; }
  .v-bloco [data-estrela] { position: absolute; width: 120px; height: 120px; right: -40px; top: -96px; }
  .v-texto { font-size: 78px; line-height: 1.14; width: 100%; max-height: 860px; overflow: hidden; text-shadow: 0 2px 24px rgba(30, 29, 74, .9); }
  .v-ref { display: flex; align-items: center; gap: 26px; margin-top: 56px; color: var(--ouro); }
  .v-ref::before, .v-ref::after { content: ''; width: 70px; height: 3px; background: currentColor; opacity: .6; border-radius: 2px; }

  /* horizonte: a tenda acesa embaixo, olhando para o céu */
  .v-horizonte { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 420px; }
  .v-horizonte svg { width: 100%; height: 100%; display: block; }
  .v-rodape { margin-top: 110px; font: 600 30px/1.2 var(--fonte-texto); letter-spacing: .04em; color: var(--areia); opacity: .85; }
</style>
</head>
<body data-template="story-versiculo" data-titulo="Story — Versículo">
<main class="palco">

  <!-- =====================================================================
       STORY 1080 × 1920 — VERSÍCULO
       No navegador: clique no versículo, na referência e no rodapé para editar.
       Pelo código: procure os comentários "TROQUE AQUI".
       O texto diminui sozinho se o versículo for longo.
       ===================================================================== -->
  <div class="arte story tema-noite versiculo" data-arquivo="story-versiculo">
    <div class="ceu" data-estrelas="230" data-semente="5"></div>

    <!-- TROQUE AQUI: chamada -->
    <p class="chamada v-chamada" data-editavel>Palavra para hoje</p>

    <div class="v-bloco">
      <span data-estrela="ouro"></span>
      <!-- TROQUE AQUI: o versículo -->
      <p class="titulo italico v-texto" data-editavel data-ajustar=".5" data-altura-max="860">“Olha agora para os céus e conta as estrelas, se as podes contar. Assim será a tua descendência.”</p>
    </div>

    <!-- TROQUE AQUI: referência bíblica -->
    <p class="chamada v-ref" data-editavel>Gênesis 15:5</p>

    <!-- TROQUE AQUI: convite no rodapé (ou apague o texto) -->
    <p class="v-rodape" data-editavel>Cultos às terças e sextas · 19h30</p>

    <div class="v-horizonte">
      <svg viewBox="0 0 1080 420" preserveAspectRatio="none">
        <path d="M0 210 C 260 140, 820 140, 1080 220 L1080 420 L0 420 Z" fill="#2A2862"/>
        <path d="M0 300 C 300 240, 760 250, 1080 300 L1080 420 L0 420 Z" fill="#1E1D4A"/>
        <!-- a tenda da marca, pequena, com a porta acesa -->
        <g transform="translate(493 45) scale(1.15)">
          <path fill="#F7EEE2" d="M40 26 Q27 66 0 100 L82 100 Q54 66 40 26Z" stroke="#F7EEE2" stroke-width="6" stroke-linejoin="round"/>
          <path fill="#D1552E" d="M41.5 54 C38 68 32 86 28 100 L56 100 C50 86 44 68 41.5 54Z"/>
        </g>
      </svg>
    </div>

  </div>

</main>
<script src="assets/html-to-image.js"></script>
<script src="assets/marca-dados.js"></script>
<script src="assets/marca.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>
